<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Deepseek API Chat</title>
        <link rel="stylesheet" href="styles.css" />
        <script src="script.js" defer></script>
    </head>
    <body>
        <main class="container">
            <header class="header">
                <h2 class="title">Deepseek API</h2>
            </header>
            <div class="content" id="content">
                <section class="answer-section">Hello! How can i help you today? ⋆｡‧˚ʚ🍓ɞ˚‧｡⋆</section>
            </div>
            <footer class="chat-form">
                <input
                    id="chatInput"
                    type="text"
                    class="chat-input"
                    placeholder="Type message"
                    autocomplete="off"
                />
                <button class="send-button" id="sendButton">
                    <?xml version="1.0"?><svg
                        style="fill: white; width: 20px; height: 20px"
                        version="1.1"
                        viewBox="0 0 24 24"
                        xml:space="preserve"
                        xmlns="http://www.w3.org/2000/svg"
                        xmlns:xlink="http://www.w3.org/1999/xlink"
                    >
                        <g id="info" />
                        <g id="icons">
                            <path
                                d="M21.5,11.1l-17.9-9C2.7,1.7,1.7,2.5,2.1,3.4l2.5,6.7L16,12L4.6,13.9l-2.5,6.7c-0.3,0.9,0.6,1.7,1.5,1.2l17.9-9   C22.2,12.5,22.2,11.5,21.5,11.1z"
                                id="send"
                            />
                        </g>
                    </svg>
                </button>
            </footer>
        </main>
    </body>
</html>
